<style>
  :root {
    --bg: #FBF6F2;
    --bg-tint: #F6EFE9;
    --glow: rgba(255, 150, 90, .30);
    --glow-2: rgba(150, 180, 255, .26);
    --ink: #15121A;
    --muted: #64605C;
    --accent: #FF7A3D;          /* kehribar fill (buttons, bars); text on it is --on-accent */
    --accent-hover: #FF9C73;
    --accent-strong: #8F4410;   /* kehribar as text, links and icons */
    --brand: #15121A;   /* "DodoBrowser" in the logo (marka\LOGO-STANDARDI.md) */
    --on-accent: #15121A;
    --btn-glow: rgba(255, 94, 42, .30);
    --card: #FFFFFF;
    --card-border: rgba(143, 68, 16, .12);
    --field: #78716C;   /* a button's edge, 3:1 on every surface (as index.html) */
    --icon-bg: #F6F1ED;
    --shadow: 0 1px 2px rgba(60, 30, 10, .06), 0 10px 28px rgba(60, 30, 10, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1B191E;
      --bg-tint: #221D21;
      --glow: rgba(255, 120, 44, .22);
      --glow-2: rgba(70, 72, 210, .22);
      --ink: #F3F1F5;
      --muted: #B7B5BC;
      --accent: #FF8A3D;
      --accent-hover: #FEC29E;
      --accent-strong: #FFB06E;
      --brand: #F3F1F5;
      --on-accent: #15121A;
      --btn-glow: rgba(255, 94, 42, .24);
      --card: #27252A;
      --card-border: rgba(255, 176, 110, .14);
      --field: #8F8A93;
      --icon-bg: #333036;
      --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px rgba(0, 0, 0, .35);
    }
  }
  /* The brand font Inter Tight stays declared but is no longer used (13 Nov, the user: it is only for the
     logo, the slogan and promo pictures, marka\LOGO-STANDARDI.md): headings, the menu, buttons and the
     questions are Segoe UI Variable Display like the program, running text Segoe UI Variable Text. */
  @font-face {
    font-family: "Inter Tight";
    src: url("/yazi/InterTight.woff2") format("woff2");
    font-weight: 400 800;
    font-display: swap;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--ink); line-height: 1.65; -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(700px 420px at 10% -12%, var(--glow), transparent 70%),
      radial-gradient(640px 400px at 92% -14%, var(--glow-2), transparent 70%),
      linear-gradient(var(--bg-tint), var(--bg) 420px);
    background-color: var(--bg);
    min-height: 100vh;
  }
  /* Links as in DodoBrowser (start\dodo.css): no line; a name inside a sentence is semibold too. */
  a { color: var(--accent-strong); text-decoration: none; }
  a:hover { color: color-mix(in srgb, var(--accent-strong), var(--ink) 30%); }
  p a:not(.btn), li a:not(.btn), td a { font-weight: 600; }
  a:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; border-radius: 4px; }
  .wrap { width: min(1120px, 100% - 32px); margin: 0 auto; }

  header.top { border-bottom: 1px solid var(--card-border); }
  header.top .wrap { display: flex; align-items: center; gap: 16px; height: 64px; }
  .logo-link { display: flex; align-items: center; gap: 6.9px; text-decoration: none; color: var(--ink); --logo-dodo: var(--brand); font-size: 13.9px; }
  /* logo-yap: site-css begin (logo\logo-yap.py writes this part) */
  /* The logo standard (marka\LOGO-STANDARDI.md): font-size is the capitals' height;
     the symbol D is that x 2.29, the gap D x .3. */
  .wm, .wm-slogan { display: block; height: 1em; width: auto; overflow: visible; fill: currentColor; }
  .wm { aspect-ratio: 7.98; }
  .wm-slogan { aspect-ratio: 10.71; }
  /* logo-yap: site-css end */
  .logo-link svg:not(.wm) { width: 34px; height: 34px; }
  .back { margin-left: auto; color: var(--muted); text-decoration: none; font-size: 15px; padding: 8px 12px; border-radius: 999px; }
  .back:hover { color: var(--ink); background: var(--card); }

  main { width: min(760px, 100% - 32px); margin: 0 auto; padding: 56px 0 40px; }
  .kicker { color: var(--accent-strong); font-weight: 600; font-size: 14px; margin: 0 0 8px; }   /* sentence case, as every heading in DodoBrowser */
  h1 { font-size: clamp(32px, 5vw, 46px); line-height: 1.1; letter-spacing: -.022em; margin: 0 0 10px; }
  .tag { color: var(--muted); margin: 0 0 36px; }
  section {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 16px;
    padding: 22px 26px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  section.lead { border-left: 4px solid var(--accent); }
  h2 { font-size: 18px; margin: 0 0 8px; }
  p { margin: 0 0 10px; }
  p:last-child { margin-bottom: 0; }
  ul { margin: 0 0 12px; padding-left: 20px; }
  li { margin-bottom: 8px; }
  li::marker { color: var(--accent-strong); }

  footer.bottom { border-top: 1px solid var(--card-border); padding: 28px 0 40px; color: var(--muted); font-size: 14.5px; }
  footer.bottom .wrap { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center; }
  footer.bottom .wrap > :first-child { margin-right: auto; }
  footer.bottom a { color: var(--muted); }
  footer.bottom .lang { display: inline-flex; align-items: center; gap: 8px; }
  footer.bottom .lang [aria-current] { color: var(--ink); font-weight: 600; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (max-width: 620px) { section { padding: 18px 18px; } main { padding-top: 40px; } }
  /* Not found (GitHub Pages serves this file for any missing address, so every path is absolute). */
  main.nf { text-align: center; padding: 88px 0 72px; }
  .nf .bird { width: 96px; height: 96px; margin: 0 auto 20px; display: block; }
  .nf .tag { margin: 0 auto 28px; max-width: 46ch; }
  .nf .cta { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .nf .other { margin: 32px auto 0; color: var(--muted); font-size: 15px; }   /* the short English note */
  .btn {
    display: inline-flex; align-items: center; gap: 8px; border: 0;
    font: inherit; font-size: 16px; font-weight: 600; text-decoration: none;
    padding: 13px 22px; border-radius: 999px; cursor: pointer;
    transition: transform .2s, box-shadow .2s, border-color .2s;
  }
  .btn.primary { color: var(--on-accent); background: var(--accent); box-shadow: 0 8px 22px var(--btn-glow); }
  .btn.primary:hover { transform: translateY(-2px); background: var(--accent-hover); box-shadow: 0 14px 30px var(--btn-glow); }
  .btn.ghost { color: var(--ink); background: var(--card); border: 1px solid var(--field); }
  .btn.ghost:hover { border-color: var(--accent); transform: translateY(-2px); }
  .btn:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 3px; }
  @media (max-width: 620px) { main.nf { padding: 56px 0 48px; } .nf .btn { width: 100%; justify-content: center; } }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } .btn:hover { transform: none; } }
  /* Last, so it wins over each part's own "font: inherit". */
  h1, h2, h3, h4, .kicker, .eyebrow, nav.links a, .back, .btn, .store span, .faq summary, .mini b, .points b, .strip li b, .copy, .smenu .big, .sp .greet {
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
</style>
</head>
