# Copied to the public site repository as .github/workflows/liste.yml.
# Every day: the block list is built again (liste/olustur.sh) and published on
# https://dodobrowser.com/liste/engelli-alanlar.txt when it changed; so are the
# filter lists (liste/filtreler.sh -> https://dodobrowser.com/liste/filtreler.txt).
name: Reklam listesi
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  liste:
    runs-on: ubuntu-latest
    steps:
      # Commit SHA ile sabit (güvenlik denetimi D4, 24 Ekim): hareketli v4 etiketi ele
      # geçirilirse iş akışı değişmesin. SHA, v4'ün 24 Ekim 2026'daki hali; site deposuna
      # gönderilmeden önce (ayrı onay) güncel v4 ile karşılaştır.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Listeyi olustur
        run: bash liste/olustur.sh
      # The filter lists (7 Oct 2026): a failure here leaves yesterday's file and
      # doesn't stop the domain list.
      - name: Filtre listesini olustur
        run: bash liste/filtreler.sh || git checkout -- liste/filtreler.txt 2>/dev/null || true
      # Signed lists (review B-04, 29 Oct 2026): the program takes a list only with a valid signature.
      # The private key is the GitHub secret LISTE_IMZA_ANAHTARI, read only by this step.
      - name: Listeleri imzala
        env:
          LISTE_IMZA_ANAHTARI: ${{ secrets.LISTE_IMZA_ANAHTARI }}
        run: |
          bash liste/imzala.sh liste/engelli-alanlar.txt engelli-alanlar 1
          if [ -f liste/filtreler.txt ]; then bash liste/imzala.sh liste/filtreler.txt filtreler 1; fi
      - name: Degistiyse gonder
        run: |
          git add -N liste/filtreler.txt 2>/dev/null || true
          if git diff --quiet -- liste/engelli-alanlar.txt liste/filtreler.txt; then echo "Degisiklik yok"; exit 0; fi
          git config user.name "dodobrowser-liste"
          git config user.email "dodobrowser-liste@users.noreply.github.com"
          git add liste/engelli-alanlar.txt
          if [ -f liste/filtreler.txt ]; then git add liste/filtreler.txt; fi
          git commit -m "Reklam listeleri guncellendi"
          git push
